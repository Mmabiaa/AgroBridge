name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Job 1: Create Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.1.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this Release
            ${{ steps.changelog.outputs.changelog }}
            
            ## Docker Images
            All service images are available at:
            `ghcr.io/${{ github.repository_owner }}/agrobridge-<service>:${{ github.ref_name }}`
            
            ## Deployment
            ```bash
            kubectl set image deployment -n agrobridge \
              --all=ghcr.io/${{ github.repository_owner }}/agrobridge-*:${{ github.ref_name }}
            ```
          draft: false
          prerelease: false

  # Job 2: Build Release Artifacts
  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p release
          cp -r backend/kubernetes release/
          cp -r backend/docker release/
          cp README.md release/
          tar -czf agrobridge-${{ github.ref_name }}.tar.gz release/

      - name: Upload release artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./agrobridge-${{ github.ref_name }}.tar.gz
          asset_name: agrobridge-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip

  # Job 3: Update Documentation
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update version in docs
        run: |
          sed -i "s/version: .*/version: ${{ github.ref_name }}/" docs/conf.py

      - name: Build documentation
        run: |
          pip install mkdocs mkdocs-material
          mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

  # Job 4: Notify Release
  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, build-artifacts, update-docs]
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            🎉 New release ${{ github.ref_name }} is available!
            View release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: AgroBridge Release ${{ github.ref_name }}
          body: |
            A new version of AgroBridge has been released!
            
            Version: ${{ github.ref_name }}
            Release Notes: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          to: team@agrobridge.com
          from: noreply@agrobridge.com
