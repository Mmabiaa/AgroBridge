<!DOCTYPE html>
<html>

<head>
    <title>Test Registration</title>
</head>

<body>
    <h1>Test Registration</h1>
    <form id="registrationForm">
        <input type="text" id="username" placeholder="Username" required><br><br>
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Password" required><br><br>
        <input type="password" id="password_confirm" placeholder="Confirm Password" required><br><br>
        <input type="text" id="first_name" placeholder="First Name" required><br><br>
        <input type="text" id="last_name" placeholder="Last Name" required><br><br>
        <select id="role">
            <option value="farmer">Farmer</option>
            <option value="buyer">Buyer</option>
        </select><br><br>
        <button type="submit">Register</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                password_confirm: document.getElementById('password_confirm').value,
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                role: document.getElementById('role').value
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/auth/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                document.getElementById('result').innerHTML = `
                    <h3>Status: ${response.status}</h3>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h3>Error: ${error.message}</h3>
                `;
            }
        });
    </script>
</body>

</html>
