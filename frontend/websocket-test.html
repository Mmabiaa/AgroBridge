<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .connected {
            background-color: #d4edda;
            color: #155724;
        }

        .disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .message {
            background-color: #f8f9fa;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #007bff;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        input[type="text"] {
            padding: 8px;
            width: 300px;
            margin: 5px;
        }

        #messages {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AgroBridge WebSocket Test</h1>

        <div id="status" class="status disconnected">Disconnected</div>

        <div>
            <input type="text" id="tokenInput" placeholder="JWT Token (optional)" />
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>

        <div>
            <input type="text" id="messageInput" placeholder="Enter message" />
            <button onclick="sendPing()">Send Ping</button>
            <button onclick="sendEcho()">Send Echo</button>
            <button onclick="sendCustom()">Send Custom</button>
        </div>

        <h3>Messages:</h3>
        <div id="messages"></div>

        <button onclick="clearMessages()">Clear Messages</button>
    </div>

    <script>
        let ws = null;
        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');
        const tokenInput = document.getElementById('tokenInput');
        const messageInput = document.getElementById('messageInput');

        function updateStatus(connected, message) {
            statusEl.textContent = message;
            statusEl.className = `status ${connected ? 'connected' : 'disconnected'}`;
        }

        function addMessage(message, type = 'info') {
            const messageEl = document.createElement('div');
            messageEl.className = 'message';
            messageEl.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${JSON.stringify(message, null, 2)}`;
            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addMessage('Already connected');
                return;
            }

            const token = tokenInput.value.trim();
            let url = 'ws://localhost:8000/ws/';

            // Use simple endpoint if no token provided
            if (!token) {
                url = 'ws://localhost:8000/ws/simple/';
            } else {
                url += `?token=${token}`;
            }

            addMessage(`Connecting to ${url}...`);
            updateStatus(false, 'Connecting...');

            ws = new WebSocket(url);

            ws.onopen = function (event) {
                updateStatus(true, 'Connected');
                addMessage('WebSocket connected successfully');
            };

            ws.onmessage = function (event) {
                try {
                    const data = JSON.parse(event.data);
                    addMessage(data, 'received');
                } catch (e) {
                    addMessage(event.data, 'received');
                }
            };

            ws.onclose = function (event) {
                updateStatus(false, `Disconnected (Code: ${event.code})`);
                addMessage(`WebSocket closed with code: ${event.code}`);
                ws = null;
            };

            ws.onerror = function (error) {
                updateStatus(false, 'Error');
                addMessage(`WebSocket error: ${error}`);
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function sendMessage(message) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('Not connected');
                return;
            }

            ws.send(JSON.stringify(message));
            addMessage(message, 'sent');
        }

        function sendPing() {
            sendMessage({
                type: 'ping',
                data: { message: 'Hello from browser' }
            });
        }

        function sendEcho() {
            const customMessage = messageInput.value.trim() || 'Default echo message';
            sendMessage({
                type: 'echo',
                data: { message: customMessage }
            });
        }

        function sendCustom() {
            const customMessage = messageInput.value.trim();
            if (!customMessage) {
                addMessage('Please enter a custom message');
                return;
            }

            try {
                const parsed = JSON.parse(customMessage);
                sendMessage(parsed);
            } catch (e) {
                sendMessage({
                    type: 'custom',
                    data: { message: customMessage }
                });
            }
        }

        function clearMessages() {
            messagesEl.innerHTML = '';
        }

        // Auto-connect on page load
        window.onload = function () {
            // You can uncomment this to auto-connect
            // connect();
        };
    </script>
</body>

</html>
