version: '3.8'

# AgroBridge Security Services
# Docker Compose configuration for security hardening components
# Requirements: 34.1, 34.5, 34.6, 34.7, 34.8

services:
  # ModSecurity WAF
  modsecurity:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: agrobridge-waf
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./waf/modsecurity.conf:/etc/modsecurity/modsecurity.conf:ro
      - ./waf/crs-setup.conf:/etc/modsecurity/crs-setup.conf:ro
      - ./waf/custom-rules.conf:/etc/modsecurity/rules/custom-rules.conf:ro
      - ./waf/whitelist.conf:/etc/modsecurity/rules/whitelist.conf:ro
      - waf-logs:/var/log/modsecurity
    environment:
      - PARANOIA=2
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - PROXY_SSL=on
      - BACKEND=http://nginx-ddos:80
    networks:
      - agrobridge-security
      - agrobridge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx DDoS Protection Layer
  nginx-ddos:
    image: nginx:alpine
    container_name: agrobridge-ddos
    volumes:
      - ./ddos/rate-limits.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ddos/nginx.conf:/etc/nginx/nginx.conf:ro
      - ddos-logs:/var/log/nginx
    environment:
      - BACKEND_HOST=kong
      - BACKEND_PORT=8000
    networks:
      - agrobridge-security
      - agrobridge-network
    restart: unless-stopped
    depends_on:
      - kong
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Wazuh Manager (SIEM)
  wazuh-manager:
    image: wazuh/wazuh-manager:latest
    container_name: agrobridge-wazuh-manager
    ports:
      - "1514:1514"  # Agent connection
      - "1515:1515"  # Agent enrollment
      - "514:514/udp"  # Syslog
      - "55000:55000"  # API
    volumes:
      - wazuh-data:/var/ossec/data
      - wazuh-logs:/var/ossec/logs
      - wazuh-etc:/var/ossec/etc
      - ./siem/ossec-rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=none
    networks:
      - agrobridge-security
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Wazuh Indexer (OpenSearch)
  wazuh-indexer:
    image: wazuh/wazuh-indexer:latest
    container_name: agrobridge-wazuh-indexer
    ports:
      - "9200:9200"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
      - network.host=0.0.0.0
    networks:
      - agrobridge-security
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Wazuh Dashboard
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:latest
    container_name: agrobridge-wazuh-dashboard
    ports:
      - "5601:5601"
    volumes:
      - ./siem/security-dashboards.json:/usr/share/wazuh-dashboard/data/wazuh/config/dashboards.json:ro
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh-manager
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    networks:
      - agrobridge-security
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # OWASP ZAP for Security Testing
  zap:
    image: owasp/zap2docker-stable
    container_name: agrobridge-zap
    ports:
      - "8080:8080"
    command: zap-webswing.sh
    networks:
      - agrobridge-security
      - agrobridge-network
    restart: unless-stopped
    profiles:
      - testing

  # Filebeat for Log Shipping
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: agrobridge-filebeat
    user: root
    volumes:
      - ./siem/filebeat-security.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - waf-logs:/var/log/modsecurity:ro
      - ddos-logs:/var/log/nginx:ro
      - filebeat-data:/usr/share/filebeat/data
    environment:
      - ELASTICSEARCH_HOSTS=http://wazuh-indexer:9200
      - ELASTICSEARCH_USERNAME=admin
      - ELASTICSEARCH_PASSWORD=SecretPassword
    networks:
      - agrobridge-security
    depends_on:
      - wazuh-indexer
    restart: unless-stopped

  # Certificate Manager (for mTLS rotation)
  cert-manager:
    build:
      context: ./mtls
      dockerfile: Dockerfile
    container_name: agrobridge-cert-manager
    volumes:
      - ./mtls/certs:/certs
      - ./mtls/ca-config.json:/config/ca-config.json:ro
    environment:
      - CERT_ROTATION_DAYS=30
      - CERT_VALIDITY_DAYS=365
    networks:
      - agrobridge-security
    restart: unless-stopped
    profiles:
      - cert-rotation

  # Security Monitoring Dashboard
  security-dashboard:
    image: grafana/grafana:latest
    container_name: agrobridge-security-dashboard
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana-security.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-security-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - agrobridge-security
    depends_on:
      - wazuh-indexer
    restart: unless-stopped

networks:
  agrobridge-security:
    driver: bridge
    name: agrobridge-security
  agrobridge-network:
    external: true
    name: agrobridge-network

volumes:
  waf-logs:
    name: agrobridge-waf-logs
  ddos-logs:
    name: agrobridge-ddos-logs
  wazuh-data:
    name: agrobridge-wazuh-data
  wazuh-logs:
    name: agrobridge-wazuh-logs
  wazuh-etc:
    name: agrobridge-wazuh-etc
  wazuh-indexer-data:
    name: agrobridge-wazuh-indexer-data
  filebeat-data:
    name: agrobridge-filebeat-data
  grafana-security-data:
    name: agrobridge-grafana-security-data
