# AgroBridge DDoS Protection - Rate Limiting Configuration
# Requirements: 34.8

# Global rate limits
limit_req_zone $binary_remote_addr zone=global:10m rate=1000r/s;
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=100r/s;
limit_req_zone $http_authorization zone=per_user:10m rate=2000r/h;

# Authentication endpoints - stricter limits
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=auth_password_reset:10m rate=2r/m;

# API endpoints
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_search:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=10r/m;

# AI/ML endpoints - resource intensive
limit_req_zone $binary_remote_addr zone=ai_chat:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=crop_detection:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=analytics:10m rate=10r/m;

# Connection limits
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_conn_zone $server_name zone=conn_per_server:10m;

# Request body size limits
client_max_body_size 10m;
client_body_buffer_size 128k;

# Timeouts
client_body_timeout 12;
client_header_timeout 12;
keepalive_timeout 15;
send_timeout 10;

# Buffer sizes
client_body_buffer_size 10K;
client_header_buffer_size 1k;
large_client_header_buffers 2 1k;

# Server configuration
server {
    listen 80;
    server_name _;

    # Global rate limiting
    limit_req zone=global burst=50 nodelay;
    limit_req zone=per_ip burst=20 nodelay;
    limit_conn conn_per_ip 10;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # Block common attack patterns
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Authentication endpoints
    location ~ ^/api/v1/auth/login {
        limit_req zone=auth_login burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://kong:8000;
    }

    location ~ ^/api/v1/auth/register {
        limit_req zone=auth_register burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://kong:8000;
    }

    location ~ ^/api/v1/auth/password-reset {
        limit_req zone=auth_password_reset burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://kong:8000;
    }

    # AI/ML endpoints
    location ~ ^/api/v1/ai/ {
        limit_req zone=ai_chat burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 5m;
        proxy_pass http://kong:8000;
    }

    location ~ ^/api/v1/crop-detection/ {
        limit_req zone=crop_detection burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 20m;
        proxy_pass http://kong:8000;
    }

    location ~ ^/api/v1/analytics/ {
        limit_req zone=analytics burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://kong:8000;
    }

    # File upload endpoints
    location ~ ^/api/v1/files/upload {
        limit_req zone=api_upload burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 50m;
        proxy_pass http://kong:8000;
    }

    # Search endpoints
    location ~ ^/api/v1/.*/search {
        limit_req zone=api_search burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://kong:8000;
    }

    # General API endpoints
    location ~ ^/api/v1/ {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://kong:8000;
    }

    # Health check - no rate limiting
    location /health {
        access_log off;
        proxy_pass http://kong:8000;
    }

    # Default location
    location / {
        limit_req zone=global burst=50 nodelay;
        proxy_pass http://kong:8000;
    }

    # Custom error pages for rate limiting
    error_page 429 /429.json;
    location = /429.json {
        internal;
        default_type application/json;
        return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please try again later.", "retry_after": 60}';
    }

    # Custom error pages for other errors
    error_page 500 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        default_type application/json;
        return 500 '{"error": "Internal Server Error", "message": "An error occurred. Please try again later."}';
    }
}

# Geo-blocking configuration (optional)
# Uncomment to enable geo-blocking
# geo $blocked_country {
#     default 0;
#     CN 1;  # China
#     RU 1;  # Russia
#     KP 1;  # North Korea
# }

# map $blocked_country $geo_block {
#     0 "";
#     1 "blocked";
# }

# IP blacklist (can be updated dynamically)
geo $blacklist {
    default 0;
    # Add blocked IPs here
    # 192.168.1.100 1;
    # 10.0.0.50 1;
}

# Block blacklisted IPs
map $blacklist $blocked_ip {
    0 "";
    1 "blocked";
}

# User-Agent blacklist
map $http_user_agent $blocked_agent {
    default 0;
    ~*sqlmap 1;
    ~*nikto 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*nessus 1;
    ~*openvas 1;
    ~*metasploit 1;
    ~*burp 1;
    ~*w3af 1;
    ~*acunetix 1;
    ~*appscan 1;
}

# Logging configuration
log_format ddos_log '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'limit_req_status=$limit_req_status';

access_log /var/log/nginx/ddos_access.log ddos_log;
error_log /var/log/nginx/ddos_error.log warn;
