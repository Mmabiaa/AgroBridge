# ModSecurity Configuration for AgroBridge
# Web Application Firewall protecting against OWASP Top 10
# Requirements: 34.5

# -- Rule engine initialization ----------------------------------------------
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

# -- Request body handling ---------------------------------------------------
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecRequestBodyInMemoryLimit 131072

# -- Response body handling --------------------------------------------------
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# -- Filesystem configuration ------------------------------------------------
SecDataDir /tmp/
SecTmpDir /tmp/
SecUploadDir /tmp/
SecUploadKeepFiles Off

# -- Debug log configuration -------------------------------------------------
SecDebugLog /var/log/modsecurity/debug.log
SecDebugLogLevel 0

# -- Audit log configuration -------------------------------------------------
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsecurity/audit.log

# -- Miscellaneous -----------------------------------------------------------
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile unicode.mapping 20127

# -- Settings ----------------------------------------------------------------
SecServerSignature "AgroBridge WAF"
SecComponentSignature "ModSecurity for AgroBridge"

# -- Rule engine settings ----------------------------------------------------
SecRuleEngine On
SecRequestBodyAccess On
SecRule REQUEST_HEADERS:Content-Type "(?:application(?:/soap\+|/)|text/)xml" \
     "id:'200000',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"

SecRule REQUEST_HEADERS:Content-Type "application/json" \
     "id:'200001',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

SecRequestBodyLimitAction Reject
SecRule REQBODY_ERROR "!@eq 0" \
"id:'200002', phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"

SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
"id:'200003',phase:2,t:none,log,deny,status:400, \
msg:'Multipart request body failed strict validation: \
PE %{REQBODY_PROCESSOR_ERROR}, \
BQ %{MULTIPART_BOUNDARY_QUOTED}, \
BW %{MULTIPART_BOUNDARY_WHITESPACE}, \
DB %{MULTIPART_DATA_BEFORE}, \
DA %{MULTIPART_DATA_AFTER}, \
HF %{MULTIPART_HEADER_FOLDING}, \
LF %{MULTIPART_LF_LINE}, \
SM %{MULTIPART_MISSING_SEMICOLON}, \
IQ %{MULTIPART_INVALID_QUOTING}, \
IP %{MULTIPART_INVALID_PART}, \
IH %{MULTIPART_INVALID_HEADER_FOLDING}, \
FL %{MULTIPART_FILE_LIMIT_EXCEEDED}'"

SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" \
    "id:'200004',phase:2,t:none,log,deny,msg:'Multipart parser detected a possible unmatched boundary.'"

SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

SecRule TX:/^MSC_/ "!@streq 0" \
        "id:'200005',phase:2,t:none,deny,msg:'ModSecurity internal error flagged: %{MATCHED_VAR_NAME}'"

# -- Paranoia Level Settings -------------------------------------------------
# Paranoia Level 2 - Balanced security and false positives
SecAction \
 "id:900000,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.paranoia_level=2"

# -- Anomaly Scoring Settings ------------------------------------------------
SecAction \
 "id:900110,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.inbound_anomaly_score_threshold=5,\
  setvar:tx.outbound_anomaly_score_threshold=4"

# -- Application Specific Settings -------------------------------------------
SecAction \
 "id:900200,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE,\
  setvar:tx.allowed_request_content_type=application/json|application/x-www-form-urlencoded|multipart/form-data|text/xml|application/xml|application/soap+xml,\
  setvar:tx.allowed_http_versions=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0,\
  setvar:tx.restricted_extensions=.asa/ .asax/ .ascx/ .axd/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .ini/ .key/ .licx/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pol/ .printer/ .pwd/ .resources/ .resx/ .sql/ .sys/ .vb/ .vbs/ .vbproj/ .vsdisco/ .webinfo/ .xsd/ .xsx/,\
  setvar:tx.restricted_headers=/proxy/ /lock-token/ /content-range/ /if/,\
  setvar:tx.static_extensions=/.jpg/ /.jpeg/ /.png/ /.gif/ /.js/ /.css/ /.ico/ /.svg/ /.webp/"

# -- Sampling Settings -------------------------------------------------------
SecAction \
 "id:900400,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.sampling_percentage=100"

# -- GeoIP Settings ----------------------------------------------------------
# Uncomment to enable GeoIP blocking
# SecGeoLookupDB /usr/share/GeoIP/GeoIP.dat
# SecRule REMOTE_ADDR "@geoLookup" "chain,id:900500,phase:1,block,msg:'Blocked country'"
# SecRule GEO:COUNTRY_CODE "@streq CN" "t:none"

# -- Custom Rules for AgroBridge ---------------------------------------------

# Block common attack patterns
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i:(\%27)|(\')|(\-\-)|(\%23)|(#))" \
    "id:1000001,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,\
    msg:'SQL Injection Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:CRITICAL,\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-sqli',\
    tag:'OWASP_CRS',\
    tag:'OWASP_CRS/WEB_ATTACK/SQL_INJECTION'"

# Block XSS attempts
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i:<script[^>]*>[\s\S]*?</script[^>]*>|javascript:|onerror\s*=|onload\s*=)" \
    "id:1000002,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'XSS Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:CRITICAL,\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-xss',\
    tag:'OWASP_CRS',\
    tag:'OWASP_CRS/WEB_ATTACK/XSS'"

# Block path traversal
SecRule REQUEST_URI|ARGS "@rx (?i:\.\.\/|\.\.\\)" \
    "id:1000003,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,\
    msg:'Path Traversal Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:CRITICAL,\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    tag:'OWASP_CRS',\
    tag:'OWASP_CRS/WEB_ATTACK/FILE_INJECTION'"

# Block command injection
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i:;|\||`|\$\(|\$\{)" \
    "id:1000004,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,\
    msg:'Command Injection Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:CRITICAL,\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-rce',\
    tag:'OWASP_CRS',\
    tag:'OWASP_CRS/WEB_ATTACK/COMMAND_INJECTION'"

# Block file upload attacks
SecRule FILES_TMPNAMES "@rx \.(?:php|phtml|php3|php4|php5|phps|pht|phar|asp|aspx|jsp|jspx|sh|bash|bat|cmd|exe|dll)$" \
    "id:1000005,\
    phase:2,\
    block,\
    t:none,t:lowercase,\
    msg:'Malicious File Upload Detected',\
    logdata:'Filename: %{MATCHED_VAR}',\
    severity:CRITICAL,\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-file-upload',\
    tag:'OWASP_CRS'"

# Rate limiting for authentication endpoints
SecRule REQUEST_URI "@beginsWith /api/v1/auth/login" \
    "id:1000006,\
    phase:2,\
    pass,\
    t:none,\
    setvar:ip.auth_attempts=+1,\
    expirevar:ip.auth_attempts=300,\
    nolog"

SecRule IP:AUTH_ATTEMPTS "@gt 10" \
    "id:1000007,\
    phase:2,\
    block,\
    t:none,\
    msg:'Too many authentication attempts',\
    logdata:'Attempts: %{IP.AUTH_ATTEMPTS}',\
    severity:WARNING,\
    tag:'application-multi',\
    tag:'attack-brute-force'"

# Block suspicious user agents
SecRule REQUEST_HEADERS:User-Agent "@rx (?i:sqlmap|nikto|nmap|masscan|nessus|openvas|metasploit|burp|w3af|acunetix|appscan)" \
    "id:1000008,\
    phase:1,\
    block,\
    t:none,t:lowercase,\
    msg:'Malicious Scanner Detected',\
    logdata:'User-Agent: %{MATCHED_VAR}',\
    severity:CRITICAL,\
    tag:'application-multi',\
    tag:'attack-scanner'"

# Enforce HTTPS (if behind reverse proxy)
SecRule REQUEST_HEADERS:X-Forwarded-Proto "!@streq https" \
    "id:1000009,\
    phase:1,\
    pass,\
    t:none,\
    msg:'Non-HTTPS request detected',\
    severity:NOTICE,\
    tag:'application-multi',\
    chain"
SecRule REQUEST_URI "!@beginsWith /health" \
    "t:none"

# Block empty User-Agent
SecRule REQUEST_HEADERS:User-Agent "@rx ^$" \
    "id:1000010,\
    phase:1,\
    block,\
    t:none,\
    msg:'Empty User-Agent header',\
    severity:WARNING,\
    tag:'application-multi'"

# -- Include OWASP Core Rule Set ---------------------------------------------
Include /etc/modsecurity/crs-setup.conf
Include /etc/modsecurity/rules/*.conf
