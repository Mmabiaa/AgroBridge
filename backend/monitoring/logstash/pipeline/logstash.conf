# Logstash Pipeline Configuration for AgroBridge
# Processes logs from all microservices and infrastructure components

input {
  # Beats input (Filebeat)
  beats {
    port => 5044
    codec => json
  }

  # TCP input for direct log shipping
  tcp {
    port => 5000
    codec => json_lines
  }

  # HTTP input for webhook logs
  http {
    port => 8080
    codec => json
  }

  # Syslog input
  syslog {
    port => 5514
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # Extract service name from tags or source
  if [service] {
    mutate {
      add_field => { "[@metadata][service]" => "%{service}" }
    }
  }

  # Parse timestamp
  if [parsed][timestamp] {
    date {
      match => [ "[parsed][timestamp]", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Extract log level
  if [parsed][level] {
    mutate {
      add_field => { "log_level" => "%{[parsed][level]}" }
    }
  } else if [level] {
    mutate {
      add_field => { "log_level" => "%{level}" }
    }
  }

  # Extract request ID for tracing
  if [parsed][request_id] {
    mutate {
      add_field => { "trace_id" => "%{[parsed][request_id]}" }
    }
  }

  # Extract user information
  if [parsed][user_id] {
    mutate {
      add_field => { "user_id" => "%{[parsed][user_id]}" }
    }
  }

  # Extract error information
  if [parsed][error] {
    mutate {
      add_field => { "error_message" => "%{[parsed][error]}" }
    }
  }

  if [parsed][stack_trace] {
    mutate {
      add_field => { "stack_trace" => "%{[parsed][stack_trace]}" }
    }
  }

  # Add environment tag
  mutate {
    add_field => { "environment" => "${ENVIRONMENT:development}" }
  }

  # Add cluster tag
  mutate {
    add_field => { "cluster" => "agrobridge" }
  }

  # Grok patterns for common log formats
  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:log_level} %{GREEDYDATA:log_message}",
        "%{SYSLOGTIMESTAMP:timestamp} %{LOGLEVEL:log_level} %{GREEDYDATA:log_message}"
      ]
    }
    tag_on_failure => ["_grokparsefailure"]
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input" ]
  }
}

output {
  # Elasticsearch output
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logstash-%{[@metadata][service]:unknown}-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Console output for debugging (disable in production)
  # stdout {
  #   codec => rubydebug
  # }

  # Conditional outputs based on log level
  if [log_level] == "ERROR" or [log_level] == "CRITICAL" {
    # Send critical errors to alerting system
    http {
      url => "http://alertmanager:9093/api/v1/alerts"
      http_method => "post"
      format => "json"
      mapping => {
        "labels" => {
          "alertname" => "ApplicationError"
          "severity" => "critical"
          "service" => "%{[@metadata][service]}"
        }
        "annotations" => {
          "summary" => "Application error in %{[@metadata][service]}"
          "description" => "%{error_message}"
        }
      }
    }
  }
}
