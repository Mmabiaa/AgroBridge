# Alertmanager Configuration for AgroBridge
# Manages alert routing and notifications

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@agrobridge.com'
  smtp_auth_username: 'alerts@agrobridge.com'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
    
    # Warning alerts - batched notifications
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 1h
    
    # Database alerts
    - match:
        category: database
      receiver: 'database-team'
    
    # Application alerts
    - match:
        category: application
      receiver: 'dev-team'
    
    # Infrastructure alerts
    - match:
        category: infrastructure
      receiver: 'ops-team'

# Receivers
receivers:
  - name: 'default'
    email_configs:
      - to: 'team@agrobridge.com'
        headers:
          Subject: '[AgroBridge] {{ .GroupLabels.alertname }}'
    
  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@agrobridge.com'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-critical'
        title: 'Critical Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    # pagerduty_configs:
    #   - service_key: '${PAGERDUTY_SERVICE_KEY}'
  
  - name: 'warning-alerts'
    email_configs:
      - to: 'team@agrobridge.com'
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-warning'
        title: 'Warning: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
  
  - name: 'database-team'
    email_configs:
      - to: 'database-team@agrobridge.com'
        headers:
          Subject: '[Database] {{ .GroupLabels.alertname }}'
  
  - name: 'dev-team'
    email_configs:
      - to: 'dev-team@agrobridge.com'
        headers:
          Subject: '[Application] {{ .GroupLabels.alertname }}'
  
  - name: 'ops-team'
    email_configs:
      - to: 'ops-team@agrobridge.com'
        headers:
          Subject: '[Infrastructure] {{ .GroupLabels.alertname }}'

# Inhibition rules
inhibit_rules:
  # Inhibit warning if critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
  
  # Inhibit service down if infrastructure is down
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      category: 'application'
    equal: ['instance']
