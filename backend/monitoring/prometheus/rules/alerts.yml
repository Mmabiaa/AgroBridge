# Prometheus Alert Rules for AgroBridge
# Defines alerting conditions for system health and performance

groups:
  - name: infrastructure_alerts
    interval: 30s
    rules:
      # Service Down Alerts
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute."

      # High CPU Usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 5 minutes."

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% for more than 5 minutes."

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below 15% on {{ $labels.mountpoint }}."

      # Disk Space Critical
      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 5
        for: 1m
        labels:
          severity: critical
          category: capacity
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "Disk space is below 5% on {{ $labels.mountpoint }}."

  - name: database_alerts
    interval: 30s
    rules:
      # PostgreSQL Down
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database is not responding."

      # PostgreSQL High Connections
      - alert: PostgreSQLHighConnections
        expr: sum(pg_stat_activity_count) > 80
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "PostgreSQL high connection count"
          description: "PostgreSQL has more than 80 active connections."

      # MongoDB Down
      - alert: MongoDBDown
        expr: mongodb_up == 0
        for: 1m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "MongoDB is down"
          description: "MongoDB database is not responding."

      # Redis Down
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Redis is down"
          description: "Redis cache is not responding."

      # Redis High Memory
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Redis high memory usage"
          description: "Redis memory usage is above 90%."

  - name: application_alerts
    interval: 30s
    rules:
      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is above 5% for more than 5 minutes."

      # High Response Time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High response time on {{ $labels.service }}"
          description: "95th percentile response time is above 1 second."

      # High Request Rate
      - alert: HighRequestRate
        expr: rate(http_requests_total[5m]) > 1000
        for: 5m
        labels:
          severity: info
          category: traffic
        annotations:
          summary: "High request rate on {{ $labels.service }}"
          description: "Request rate is above 1000 req/s."

  - name: message_queue_alerts
    interval: 30s
    rules:
      # RabbitMQ Down
      - alert: RabbitMQDown
        expr: rabbitmq_up == 0
        for: 1m
        labels:
          severity: critical
          category: messaging
        annotations:
          summary: "RabbitMQ is down"
          description: "RabbitMQ message broker is not responding."

      # RabbitMQ High Queue Size
      - alert: RabbitMQHighQueueSize
        expr: rabbitmq_queue_messages > 10000
        for: 10m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: "RabbitMQ high queue size"
          description: "Queue {{ $labels.queue }} has more than 10000 messages."

      # RabbitMQ No Consumers
      - alert: RabbitMQNoConsumers
        expr: rabbitmq_queue_consumers == 0 and rabbitmq_queue_messages > 0
        for: 5m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: "RabbitMQ queue has no consumers"
          description: "Queue {{ $labels.queue }} has messages but no consumers."

  - name: api_gateway_alerts
    interval: 30s
    rules:
      # Kong Down
      - alert: KongDown
        expr: kong_nginx_http_current_connections == 0
        for: 1m
        labels:
          severity: critical
          category: gateway
        annotations:
          summary: "Kong API Gateway is down"
          description: "Kong API Gateway is not responding."

      # Kong High Latency
      - alert: KongHighLatency
        expr: kong_latency_ms > 1000
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Kong high latency"
          description: "Kong API Gateway latency is above 1 second."

  - name: service_discovery_alerts
    interval: 30s
    rules:
      # Consul Down
      - alert: ConsulDown
        expr: consul_up == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Consul is down"
          description: "Consul service discovery is not responding."

      # Consul No Leader
      - alert: ConsulNoLeader
        expr: consul_raft_leader == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Consul has no leader"
          description: "Consul cluster has no elected leader."

  - name: secrets_management_alerts
    interval: 30s
    rules:
      # Vault Sealed
      - alert: VaultSealed
        expr: vault_core_unsealed == 0
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Vault is sealed"
          description: "Vault secrets manager is sealed and cannot serve requests."

      # Vault Down
      - alert: VaultDown
        expr: vault_up == 0
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Vault is down"
          description: "Vault secrets manager is not responding."
