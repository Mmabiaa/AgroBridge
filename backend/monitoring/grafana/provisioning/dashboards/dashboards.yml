# Grafana Dashboards Provisioning for AgroBridge

apiVersion: 1

providers:
  - name: 'AgroBridge Dashboards'
    orgId: 1
    folder: 'AgroBridge'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true
