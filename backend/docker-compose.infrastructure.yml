version: '3.8'

services:
  # PostgreSQL - Primary relational database
  postgres:
    image: postgres:16-alpine
    container_name: agrobridge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrobridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrobridge_password}
      POSTGRES_DB: agrobridge_default
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - agrobridge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrobridge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # TimescaleDB - Time-series database for IoT sensor data
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: agrobridge-timescaledb
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-agrobridge}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-agrobridge_password}
      POSTGRES_DB: agrobridge_iot_timeseries
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - agrobridge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-agrobridge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB - Document database for AI conversations and logs
  mongodb:
    image: mongo:7
    container_name: agrobridge-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-agrobridge}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-agrobridge_password}
      MONGO_INITDB_DATABASE: agrobridge_default
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - agrobridge-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: mongod --auth

  # Redis - Caching and session management
  redis:
    image: redis:7-alpine
    container_name: agrobridge-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-agrobridge_redis}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - agrobridge-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Sentinel - High availability for Redis
  redis-sentinel:
    image: redis:7-alpine
    container_name: agrobridge-redis-sentinel
    command: >
      redis-sentinel /etc/redis/sentinel.conf
    ports:
      - "${REDIS_SENTINEL_PORT:-26379}:26379"
    volumes:
      - ./config/redis-sentinel.conf:/etc/redis/sentinel.conf
      - redis_sentinel_data:/data
    networks:
      - agrobridge-network
    depends_on:
      - redis
    restart: unless-stopped

  # Elasticsearch - Search engine for products, courses, and logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: agrobridge-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - agrobridge-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kibana - Elasticsearch visualization (optional, for development)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: agrobridge-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      - agrobridge-network
    depends_on:
      - elasticsearch
    restart: unless-stopped
    profiles:
      - dev

  # PgAdmin - PostgreSQL management tool (optional, for development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agrobridge-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@agrobridge.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - agrobridge-network
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - dev

  # Mongo Express - MongoDB management tool (optional, for development)
  mongo-express:
    image: mongo-express:latest
    container_name: agrobridge-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGODB_USER:-agrobridge}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGODB_PASSWORD:-agrobridge_password}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_USER:-agrobridge}:${MONGODB_PASSWORD:-agrobridge_password}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    networks:
      - agrobridge-network
    depends_on:
      - mongodb
    restart: unless-stopped
    profiles:
      - dev

  # Redis Commander - Redis management tool (optional, for development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: agrobridge-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-agrobridge_redis}
    ports:
      - "${REDIS_COMMANDER_PORT:-8082}:8081"
    networks:
      - agrobridge-network
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  timescale_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  redis_sentinel_data:
    driver: local
  elasticsearch_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  agrobridge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
