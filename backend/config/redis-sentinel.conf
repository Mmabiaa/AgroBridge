# Redis Sentinel configuration for high availability

# Port on which Sentinel will run
port 26379

# Sentinel will monitor this master
sentinel monitor mymaster redis 6379 2

# Master is considered down after 5 seconds of no response
sentinel down-after-milliseconds mymaster 5000

# Parallel syncs during failover
sentinel parallel-syncs mymaster 1

# Failover timeout
sentinel failover-timeout mymaster 10000

# Notification script (optional)
# sentinel notification-script mymaster /path/to/notification-script.sh

# Client reconfig script (optional)
# sentinel client-reconfig-script mymaster /path/to/reconfig-script.sh

# Sentinel authentication
# sentinel auth-pass mymaster agrobridge_redis

# Log level
loglevel notice

# Log file
logfile ""

# Working directory
dir /data
