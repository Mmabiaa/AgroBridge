_format_version: "3.0"
_transform: true

# Kong Gateway Configuration for AgroBridge Microservices
# This configuration defines all services, routes, and plugins
# Requirements: 21.1, 21.2, 26.1, 26.3, 26.5, 26.6

# Global Plugins - Applied to all routes
plugins:
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
  
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
  
  - name: response-transformer
    config:
      add:
        headers:
          - X-Content-Type-Options:nosniff
          - X-Frame-Options:DENY
          - X-XSS-Protection:1; mode=block
          - Strict-Transport-Security:max-age=31536000; includeSubDomains
          - Content-Security-Policy:default-src 'self'

services:
  # ============================================================================
  # Authentication Service
  # ============================================================================
  - name: authentication-service
    url: http://authentication:8001
    retries: 3
    connect_timeout: 5000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: auth-register
        paths:
          - /api/v1/auth/register
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              hour: 50
              policy: local
              hide_client_headers: false
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - POST
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
              exposed_headers:
                - X-Auth-Token
              credentials: true
              max_age: 3600
          - name: request-transformer
            config:
              add:
                headers:
                  - X-Service:authentication
      
      - name: auth-login
        paths:
          - /api/v1/auth/login
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              hour: 100
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - POST
                - OPTIONS
              credentials: true
      
      - name: auth-refresh
        paths:
          - /api/v1/auth/refresh
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              hour: 200
              policy: local
      
      - name: auth-logout
        paths:
          - /api/v1/auth/logout
        methods:
          - POST
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
      
      - name: auth-verify-email
        paths:
          - /api/v1/auth/verify-email
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5
              hour: 20
              policy: local
      
      - name: auth-password-reset
        paths:
          - /api/v1/auth/password-reset
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 3
              hour: 10
              policy: local

