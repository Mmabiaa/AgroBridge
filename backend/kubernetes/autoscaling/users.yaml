apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: agrobridge
  labels:
    app: users
    version: v1
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: users
      version: v1
  template:
    metadata:
      labels:
        app: users
        version: v1
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      serviceAccountName: agrobridge-service-account
      containers:
      - name: users
        image: agrobridge/users:latest
        ports:
        - name: http
          containerPort: 8002
        env:
        - name: SERVICE_NAME
          value: "users"
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: database-config
              key: postgresql-host
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: postgresql-password
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: agrobridge
  labels:
    app: users
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: http
  selector:
    app: users
